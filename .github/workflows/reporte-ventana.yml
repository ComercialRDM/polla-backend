name: 📊 Reporte Ventana de Deploy

on:
  schedule:
    - cron: '0 12 * * *'   # 7:00 AM Colombia (UTC-5)
    - cron: '0 2 * * *'    # 9:00 PM Colombia (UTC-5)

jobs:
  reporte:
    name: Enviar reporte de ventana
    runs-on: ubuntu-latest
    steps:
      - name: Determinar tipo de reporte
        id: tipo
        run: |
          HORA_UTC=$(date +%H)
          HORA_COL=$(TZ="America/Bogota" date '+%H:%M %Z')
          FECHA_COL=$(TZ="America/Bogota" date '+%A, %d de %B de %Y')

          if [ "$HORA_UTC" = "12" ]; then
            echo "titulo=🟢 Ventana de deploy ABIERTA" >> $GITHUB_OUTPUT
            echo "color=#16a34a" >> $GITHUB_OUTPUT
            echo "badge_color=#dcfce7" >> $GITHUB_OUTPUT
            echo "badge_text_color=#166534" >> $GITHUB_OUTPUT
            echo "badge=SISTEMA ACTIVO" >> $GITHUB_OUTPUT
            echo "mensaje=El sistema está disponible para deploys. Cualquier push a main pasará por el control de horario y se desplegará automáticamente si todo está correcto." >> $GITHUB_OUTPUT
            echo "detalle=Ventana permitida: 7:00 AM – 9:00 PM hora Colombia (UTC-5)" >> $GITHUB_OUTPUT
          else
            echo "titulo=🔴 Ventana de deploy CERRADA" >> $GITHUB_OUTPUT
            echo "color=#dc2626" >> $GITHUB_OUTPUT
            echo "badge_color=#fee2e2" >> $GITHUB_OUTPUT
            echo "badge_text_color=#991b1b" >> $GITHUB_OUTPUT
            echo "badge=MODO PROTEGIDO" >> $GITHUB_OUTPUT
            echo "mensaje=El sistema ha entrado en modo protegido. Cualquier intento de push o deploy fuera del horario será bloqueado automáticamente y recibirás una alerta roja inmediata." >> $GITHUB_OUTPUT
            echo "detalle=Próxima apertura: mañana a las 7:00 AM hora Colombia (UTC-5)" >> $GITHUB_OUTPUT
          fi

          echo "hora_col=$HORA_COL" >> $GITHUB_OUTPUT
          echo "fecha_col=$FECHA_COL" >> $GITHUB_OUTPUT

      - name: Enviar reporte por email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "${{ steps.tipo.outputs.titulo }} — Polla Mundialista"
          to: ${{ secrets.ALERT_EMAIL }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: |
            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
              <div style="background: ${{ steps.tipo.outputs.color }}; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
                <h1 style="margin: 0; font-size: 22px;">${{ steps.tipo.outputs.titulo }}</h1>
                <p style="margin: 6px 0 0 0; opacity: 0.9; font-size: 14px;">Polla Mundialista La Retoucherie</p>
              </div>
              <div style="background: #f9fafb; padding: 24px; border: 2px solid ${{ steps.tipo.outputs.color }}; border-top: none; border-radius: 0 0 8px 8px;">

                <div style="text-align: center; margin-bottom: 20px;">
                  <span style="display: inline-block; background: ${{ steps.tipo.outputs.badge_color }}; color: ${{ steps.tipo.outputs.badge_text_color }}; font-weight: bold; font-size: 13px; padding: 6px 18px; border-radius: 999px; letter-spacing: 1px;">
                    ${{ steps.tipo.outputs.badge }}
                  </span>
                </div>

                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                  <tr>
                    <td style="padding: 8px 0; color: #71717a; width: 140px; font-size: 14px;">Fecha</td>
                    <td style="padding: 8px 0; font-weight: bold; font-size: 14px;">${{ steps.tipo.outputs.fecha_col }}</td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; color: #71717a; font-size: 14px;">Hora Colombia</td>
                    <td style="padding: 8px 0; font-weight: bold; font-size: 14px;">${{ steps.tipo.outputs.hora_col }}</td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; color: #71717a; font-size: 14px;">Repos protegidos</td>
                    <td style="padding: 8px 0; font-size: 14px;">polla-backend · polla-frontend</td>
                  </tr>
                </table>

                <div style="padding: 16px; background: white; border-left: 4px solid ${{ steps.tipo.outputs.color }}; border-radius: 4px; margin-bottom: 16px;">
                  <p style="margin: 0; color: #374151; font-size: 14px; line-height: 1.6;">${{ steps.tipo.outputs.mensaje }}</p>
                </div>

                <p style="margin: 0; color: #6b7280; font-size: 12px; text-align: center;">${{ steps.tipo.outputs.detalle }}</p>

                <p style="margin-top: 20px; text-align: center;">
                  <a href="https://github.com/ComercialRDM/polla-backend/actions" style="background: ${{ steps.tipo.outputs.color }}; color: white; padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px;">Ver actividad en GitHub →</a>
                </p>

              </div>
            </div>
